name: Valid JSON

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, labeled ]
  pull_request_review:
    types: [submitted]

env:
  SWIFT_IMAGE: swiftlang/swift@sha256:805c5f57d2cb73adfee6821813afbc411d414e885122dd13a741c5192e74ce57  # swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-07-23-a swiftlang/swift:nightly-6.4.x-jammy
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions: {}

jobs:
  validate:
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'force-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate JSON
        run: |
          mkdir -p "$RUNNER_TEMP/manifests"
          docker run --rm \
            --env GITHUB_TOKEN="$GITHUB_TOKEN" \
            --env SPI_MANIFEST_DIR=/manifests \
            -v "$RUNNER_TEMP/manifests:/manifests" \
            -v "$PWD:/host" -w /host \
            "$SWIFT_IMAGE" swift validate.swift

      # Runs third party code, holds nothing and can reach nothing.
      - name: Evaluate manifests
        env:
          SPI_EVALUATION_MODE: fail
        run: bash .github/evaluate_manifests.sh "$RUNNER_TEMP/manifests"
