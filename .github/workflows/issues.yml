name: Automatic Pull Request

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]

env:
  SWIFT_IMAGE: swift:6.4-jammy

permissions: {}

jobs:
  acknowledgement:
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'opened'
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Acknowledgement
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `Thank for your package submission. The package is now undergoing an automated assessment. Please monitor this issue for updates.`
              })

  retrigger-acknowledgement:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.comment.body == '/retrigger' &&
      !github.event.issue.pull_request
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Retrigger acknowledgement
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `Package validation has been retriggerd.`
              })

  precheck:
    needs: acknowledgement
    if: >-
      always() &&
      (
        github.event_name == 'issues' ||
        (
          github.event_name == 'issue_comment' &&
          github.event.comment.body == '/retrigger' &&
          !github.event.issue.pull_request
        )
      ) &&
      (
        contains(github.event.issue.labels.*.name, 'Add Package') ||
        contains(github.event.issue.labels.*.name, 'Remove Package')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Parse issue body
        id: parse
        uses: actions/github-script@v9
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        with:
          script: |
              const normaliseURL = (url) => {
                if (url.endsWith("/")) {
                  url = url.slice(0, -1);
                }

                if (!url.endsWith(".git")) {
                  url += ".git";
                }

                return url.toLowerCase();
              };

              const urls = process.env.ISSUE_BODY?.match(
                /https:\/\/github.com\/[A-Za-z0-9._/-]+/g
              ) ?? [];

              const normalisedURLs = [
                ... new Set(urls.map(normaliseURL)),
                ].sort();

              core.setOutput("urls", normalisedURLs.join("\n"));
      - name: Check deny list
        id: denylist
        uses: actions/github-script@v9
        env:
          URLS: ${{ steps.parse.outputs.urls }}
        with:
          script: |
            const fs = require("fs");

            const normaliseURL = (url) => {
              if (url.endsWith("/")) {
                url = url.slice(0, -1);
              }

              if (!url.endsWith(".git")) {
                url += ".git";
              }

              return url.toLowerCase();
            };

            const deniedPackages = JSON.parse(
              fs.readFileSync("denylist.json", "utf8")
            );

            const indexedDeniedPackages = new Set(
              deniedPackages.map(({ package_url }) => normaliseURL(package_url))
            );

            const matches = [
              ...new Set(
                (process.env.URLS ?? "")
                  .split(/\r?\n/)
                  .filter(Boolean)
              ),
            ]
            .filter((url) => indexedDeniedPackages.has(url))
            .sort();

            core.setOutput("matches", matches.join("\n"));

      - name: Check package list
        id: packagelist
        uses: actions/github-script@v9
        env:
          URLS: ${{ steps.parse.outputs.urls }}
        with:
          script: |
            const fs = require("fs");

            const normaliseURL = (url) => {
              if (url.endsWith("/")) {
                url = url.slice(0, -1);
              }

              if (!url.endsWith(".git")) {
                url += ".git";
              }

              return url.toLowerCase();
            };

            const packages = JSON.parse(
              fs.readFileSync("packages.json", "utf8")
            );

            const indexedPackages = new Set(
              packages.map(normaliseURL)
            );

            const matches = [
              ...new Set(
                (process.env.URLS ?? "")
                  .split(/\r?\n/)
                  .filter(Boolean)
              ),
            ]
            .filter((url) => indexedPackages.has(url))
            .sort();

            core.setOutput("matches", matches.join("\n"));
      - name: Report packages
        if: >-
          steps.denylist.outputs.matches != '' ||
          steps.packagelist.outputs.matches != ''
        uses: actions/github-script@v9
        env:
          DENYLIST_PACKAGES: ${{ steps.denylist.outputs.matches }}
          PACKAGELIST_PACKAGES: ${{ steps.packagelist.outputs.matches }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
              const denylistPackages = (process.env.DENYLIST_PACKAGES || '')
                .split(/\r?\n/)
                .filter(Boolean)
              const packgelistPackages = (process.env.PACKAGELIST_PACKAGES || '')
                .split(/\r?\n/)
                .filter(Boolean)

              const body = ['The following packages already exist or are explicitly denied:']

              if (denylistPackages.length > 0) {
                body.push(
                  '',
                  '### Deny List',
                  ...denylistPackages.map(packageURL => `- \`${packageURL}\``)
                )
              }

              if (packagelistPackages.length > 0) {
                body.push(
                  '',
                  '### Package List',
                  ...packagelistPackages.map(packageURL => `- \`${packageURL}\``)
                )
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body.join('\n')
              })

              core.setFailed('Submitted packagese either exist or are denied.'


  add:
    needs: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      always() &&
      needs['precheck'].result == 'success' &&
      contains(github.event.issue.labels.*.name, 'Add Package') &&
      (
        github.event_name == 'issues' ||
        (
          github.event.comment.body == '/retrigger' &&
          !github.event.issue.pull_request
        )
      )
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Add Package to JSON
        run: docker run --rm -e CI=true -e GH_BODY="$GH_BODY" -v "$PWD:/host" -w /host $SWIFT_IMAGE swift .github/add_package.swift
        env:
          GH_BODY: ${{ github.event.issue.body }}

      # Fetches packages and hands them over to the next
      # step where they are evaluated by .github/evaluate_manifests.sh.
      - name: Validate JSON
        run: |
          mkdir -p "$RUNNER_TEMP/manifests"
          log_file="$RUNNER_TEMP/validation.log"

          set +e
          docker run --rm \
            -e CI=true \
            -e GITHUB_TOKEN="$GITHUB_TOKEN" \
            -e SPI_MANIFEST_DIR=/manifests \
            -v "$RUNNER_TEMP/manifests:/manifests" \
            -v "$PWD:/host" -w /host \
            "$SWIFT_IMAGE" swift validate.swift 2>&1 | tee "$log_file"
          status=${PIPESTATUS[0]}
          set -e

          validate_error="$(sed -n 's/^validateError=//p' "$log_file")"

          if [ -n "$validate_error" ]; then
            printf 'validateError=%s\n' "$validate_error" >> "$GITHUB_OUTPUT"
          fi

          exit $status
        id: validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Runs third party code, holds nothing and can reach nothing.
      - name: Evaluate manifests
        env:
          SPI_EVALUATION_MODE: fail
        run: bash .github/evaluate_manifests.sh "$RUNNER_TEMP/manifests"
        id: evaluate

      - name: Check for Changes
        run: bash .github/check_for_changes.sh
        id: check

      - name: Find Existing Pull Request
        id: existing-pr
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              head: `${context.repo.owner}:spi-auto-${context.issue.number}`
            })
            core.setOutput('exists', String(prs.length > 0))
            core.setOutput('number', prs[0]?.number ?? '')

      - name: Create Pull Request
        id: cpr
        if: >-
          steps.check.outputs.changes == 'true' &&
          steps.existing-pr.outputs.exists != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            packages.json
          commit-message: ${{ github.event.issue.title }}
          title: ${{ github.event.issue.title }}
          branch: spi-auto-${{ github.event.issue.number }}
          delete-branch: true
          body: |
            Closes #${{ github.event.issue.number }}

            ## Original Message

            ${{ github.event.issue.body }}
          committer: GitHub <noreply@github.com>
          author: GitHub <noreply@github.com>

      - name: Update Issue (Success)
        if: steps.cpr.outputs.pull-request-number != ''
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Initial validation has passed. Your package will be added to the SwiftPackageIndex in #${process.env.PR_NUMBER}.`
            })

      - name: Update Issue (Failure)
        if: ${{ failure() || steps.check.outputs.changes != 'true' }}
        uses: actions/github-script@v9
        env:
          VALIDATE_ERROR: ${{ steps.validate.outputs.validateError || steps.evaluate.outputs.validateError }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const validateError = process.env.VALIDATE_ERROR || 'None'
            await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `Unfortunately the package couldn't be added. Please review the below error to understand why.\n\n> [!TIP]\n>You can retrigger package validation by commenting  \`/retrigger\`.\n\n---\n\n### Validation Error\n\n\`\`\`\n${validateError}\n\`\`\``
            })
  remove:
    needs: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      always() &&
      needs['precheck'].result == 'success' &&
      contains(github.event.issue.labels.*.name, 'Remove Package') &&
      (
        github.event_name == 'issues' ||
        (
          github.event.comment.body == '/retrigger' && !github.event.issue.pull_request
        )
      )
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Remove Package from JSON
        run: docker run --rm -e CI=true -e GH_BODY="$GH_BODY" -e GH_ISSUE="$GH_ISSUE" -v "$PWD:/host" -w /host $SWIFT_IMAGE swift .github/remove_package.swift
        env:
          GH_BODY: ${{ github.event.issue.body }}
          GH_ISSUE: ${{ github.event.issue.number }}

      # Fetches packages and hands them over to the next
      # step where they are evaluated by .github/evaluate_manifests.sh.
      - name: Validate JSON
        run: |
          mkdir -p "$RUNNER_TEMP/manifests"
          docker run --rm \
            -e CI=true \
            -e GITHUB_TOKEN="$GITHUB_TOKEN" \
            -e SPI_MANIFEST_DIR=/manifests \
            -v "$RUNNER_TEMP/manifests:/manifests" \
            -v "$PWD:/host" -w /host \
            "$SWIFT_IMAGE" swift validate.swift
        id: validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Runs third party code, holds nothing and can reach nothing.
      - name: Evaluate manifests
        env:
          SPI_EVALUATION_MODE: fail
        run: bash .github/evaluate_manifests.sh "$RUNNER_TEMP/manifests"
        id: evaluate

      - name: Check for Changes
        run: bash .github/check_for_changes.sh
        id: check

      - name: Find Existing Pull Request
        id: existing-pr
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              head: `${context.repo.owner}:spi-auto-${context.issue.number}`
            })
            core.setOutput('exists', String(prs.length > 0))
            core.setOutput('number', prs[0]?.number ?? '')

      - name: Create Pull Request
        id: cpr
        if: >-
          steps.check.outputs.changes == 'true' &&
          steps.existing-pr.outputs.exists != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            packages.json
            denylist.json
          commit-message: ${{ github.event.issue.title }}
          title: ${{ github.event.issue.title }}
          branch: spi-auto-${{ github.event.issue.number }}
          delete-branch: true
          body: |
            Closes #${{ github.event.issue.number }}

            ## Original Message

            ${{ github.event.issue.body }}
          committer: GitHub <noreply@github.com>
          author: GitHub <noreply@github.com>

      - name: Update Issue (Success)
        if: steps.cpr.outputs.pull-request-number != ''
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Thank you! We will approve and remove these packages with #${process.env.PR_NUMBER}.`
            })

      - name: Update Issue (Failure)
        if: ${{ failure() || steps.check.outputs.changes != 'true' }}
        uses: actions/github-script@v9
        env:
          VALIDATE_ERROR: ${{ steps.validate.outputs.validateError || steps.evaluate.outputs.validateError }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const validateError = process.env.VALIDATE_ERROR || 'None'
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Oh no! We were unable to detect any valid packages in your submission. If you submitted the wrong URL and would like to update it, please [open a new issue](https://github.com/SwiftPackageIndex/PackageList/issues/new/choose).\n\n>Validate Error: ${validateError}`
            })
